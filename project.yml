# =============================================================================
# 360 车载哨兵 · iOS 端工程定义（XcodeGen）
#
# 仓库根 = 本文件所在目录。.xcodeproj 不入库，由 `xcodegen generate` 生成。
#
# 设计约束（故意为之，别改）：
#   · 部署目标 16.4 —— 覆盖到 iPhone 8 一代
#   · **不使用任何 iOS 18 / iOS 26 的 API**（新 Tab、glassEffect、ToolbarSpacer 等），
#     所以 Xcode 15.4 的 SDK 也编得过，CI 不挑机器。
#     底栏用自绘的 AuroraTabBar（视觉与 Android 端逐值一致），不依赖系统 TabView。
# =============================================================================
name: CarSentinel

options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_BITCODE: NO

targets:
  CarSentinel:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    # Info.plist 由本文件的 info.path 生成，XcodeGen 会自己把它排除在 sources 之外，
    # 不要手写 excludes —— 那个文件此刻还不存在，写死路径会让 xcodegen 报错。
    sources:
      - path: CarSentinel
    info:
      path: CarSentinel/Resources/Info.plist
      properties:
        CFBundleDisplayName: "360车载哨兵"
        CFBundleName: CarSentinel
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # ── 局域网能力（必须）────────────────────────────────────────────
        # 车机端是车里的一台 HTTP 服务，手机要在同一 WiFi 下发现并拉流。
        # 没有 NSLocalNetworkUsageDescription，iOS 14+ 会直接拒掉本地网络访问，
        # 而且**不弹权限框、不报错**，表现为「一直连不上」。
        NSLocalNetworkUsageDescription: "用于在局域网内发现并连接车载哨兵主机，查看摄像头实时画面与录像。"
        NSBonjourServices:
          - "_carsentry._tcp"

        # 车机端是 http://192.168.x.x，明文 HTTP。
        # NSAllowsLocalNetworking 只对局域网地址放开，比 NSAllowsArbitraryLoads 安全得多。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.carsentinel
        PRODUCT_NAME: CarSentinel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: "360车载哨兵"

# XcodeGen 不会自动生成 scheme，CI 里 `xcodebuild -scheme CarSentinel` 必须有它
schemes:
  CarSentinel:
    build:
      targets:
        CarSentinel: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
